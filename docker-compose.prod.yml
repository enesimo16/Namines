# Namines — ÜRETİM (Production) Yığını
#
# ── MİMARİ VE TASARIM PRENSİPLERİ ──────────────────────────────────────────────
# 1. Domain Bağımsızlığı:
#    - Henüz domain satın alınmadıysa sistem 'APP_DOMAIN=localhost' veya IP adresiyle
#      (örn. http://130.162.254.97) port 80 üzerinden HTTP olarak çalışır.
#    - Domain alındığında (örn. APP_DOMAIN=namines.com) Caddy Let's Encrypt ile
#      otomatik SSL kurar ve HTTPS'e yönlendirir.
# 2. Çok Katmanlı Güvenlik & İzolasyon:
#    - Veritabanı (5432) ve Redis (6379) dış dünyaya ASLA açılmaz; yalnızca iç
#      container ağı üzerinden erişilir.
#    - /var/run/docker.sock container'a mount EDİLMEZ (root yetki gaspını önler).
# 3. Sıfır Kesinti & Güvenli Dağıtım:
#    - Veritabanı şema güncellemeleri 'namines-migrate' profili ile izole koşar.
#    - API ve arka plan servisleri bellek/CPU sınırlarıyla host OOM çökmelerinden korunur.
#
# ── KULLANIM ───────────────────────────────────────────────────────────────────
#   1. .env.prod.example dosyasını .env olarak kopyalayın ve zorunlu alanları belirleyin.
#   2. Şema migrasyonlarını uygulayın:
#        docker compose -f docker-compose.prod.yml --profile migrate run --rm namines-migrate
#   3. Yığını başlatın:
#        docker compose -f docker-compose.prod.yml up -d
#   4. Sağlık denetimini çalıştırın:
#        ./scripts/smoke-test.sh
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── 1. PostgreSQL Control DB ────────────────────────────────────────────────
  namines-control-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunludur}
      POSTGRES_USER: ${POSTGRES_USER:-namines}
      POSTGRES_DB: ${POSTGRES_DB:-namines_control}
    volumes:
      - namines-control-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-namines} -d ${POSTGRES_DB:-namines_control}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # ── 2. Redis Cache & SignalR Backplane ──────────────────────────────────────
  namines-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD zorunludur}
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - namines-redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m

  # ── 3. Tek Seferlik EF Core Migration Runner ───────────────────────────────
  namines-migrate:
    profiles: ["migrate"]
    build:
      context: ./backend
      dockerfile: Namines.API/Dockerfile
    env_file: [.env]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=namines-control-db;Port=5432;Database=${POSTGRES_DB:-namines_control};Username=${POSTGRES_USER:-namines};Password=${POSTGRES_PASSWORD}
    command: ["--migrate"]
    depends_on:
      namines-control-db:
        condition: service_healthy
    restart: "no"

  # ── 4. ASP.NET Core 8 Backend API ──────────────────────────────────────────
  namines-backend:
    build:
      context: ./backend
      dockerfile: Namines.API/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Database__MigrateOnStartup=false
      # Caddy aynı docker ağından gelir; Production X-Forwarded-For'u yalnızca bu ağdan kabul eder
      # (Program.cs bu ayar olmadan açılışta hata verir). Docker bridge ağları 172.16.0.0/12 içindedir.
      - ForwardedHeaders__KnownNetworks__0=${FORWARDED_HEADERS_NETWORK:-172.16.0.0/12}
      - ConnectionStrings__DefaultConnection=Host=namines-control-db;Port=5432;Database=${POSTGRES_DB:-namines_control};Username=${POSTGRES_USER:-namines};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=namines-redis:6379,password=${REDIS_PASSWORD}
      - Jwt__Issuer=NaminesServer
      - Jwt__Audience=NaminesClient
      - Jwt__Key=${JWT__KEY:?JWT__KEY zorunludur (en az 32 karakter)}
      - Security__ConnectionEncryptionKey=${SECURITY_CONNECTION_ENCRYPTION_KEY:?SECURITY_CONNECTION_ENCRYPTION_KEY zorunludur}
      - Vault__BackupEncryptionKey=${VAULT_BACKUP_ENCRYPTION_KEY:?VAULT_BACKUP_ENCRYPTION_KEY zorunludur}
      - Vault__StoragePath=/app/data/vault-backups
      - PostHog__ApiKey=${POSTHOG_API_KEY:-}
      - PostHog__Host=${POSTHOG_HOST:-https://eu.i.posthog.com}
    expose:
      - "8080"
    depends_on:
      namines-control-db:
        condition: service_healthy
      namines-redis:
        condition: service_healthy
    volumes:
      - namines-app-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g

  # ── 5. Next.js Main Frontend ───────────────────────────────────────────────
  namines-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-/ingest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://namines-backend:8080
      - DESK_ORIGIN_URL=http://namines-desk:3200
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-/ingest}
    expose:
      - "3000"
    depends_on:
      namines-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  # ── 6. Namines Desk Mikroservisi ───────────────────────────────────────────
  namines-desk:
    build:
      context: ./services/desk
      dockerfile: Dockerfile
      args:
        NAMINES_API: ${PUBLIC_APP_URL:-http://localhost}
        # Tarayici ayni origin uzerinden /api (Caddy) cagirir; bos = goreli.
        NAMINES_PUBLIC_API: ""
        NAMINES_FRONTEND: ${PUBLIC_APP_URL:-http://localhost}
        DESK_BASE_PATH: /desk
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NAMINES_API=http://namines-backend:8080
      # Sunucu tarafi (handoff route) icin runtime adresi. NAMINES_API build zamaninda
      # tarayici adresiyle (PUBLIC_APP_URL) sabitlendigi icin sunucuda ise yaramaz.
      - NAMINES_API_INTERNAL=http://namines-backend:8080
      - NAMINES_FRONTEND=http://namines-frontend:3000
      - DESK_BASE_PATH=/desk
    expose:
      - "3200"
    depends_on:
      namines-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  # ── 7. Caddy Ağ Geçidi (Otomatik HTTPS / IP / Localhost Proxy) ──────────────
  namines-gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - namines-frontend
      - namines-backend
      - namines-desk
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  namines-control-db-data:
  namines-redis-data:
  namines-app-data:
  caddy-data:
  caddy-config:
