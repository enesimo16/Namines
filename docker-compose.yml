services:
  # ─── Control DB: PostgreSQL (G7 — SQLite'tan tam geçiş) ──────────────────
  namines-control-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=namines
      - POSTGRES_PASSWORD=namines_dev_only_change_in_prod
      - POSTGRES_DB=namines_control
    volumes:
      - namines-control-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namines"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # Yerel geliştirmede host'tan da bağlanabilmek için (dotnet ef vb.).
      # Prod'da bu portu dışarı açma — yönetilen bir DB kullan (bkz. 06-DATA-PLANE.md).
      - "5432:5432"

  # ─── Backend: ASP.NET Core 8 API ─────────────────────────────────────────
  namines-backend:
    build:
      context: ./backend
      dockerfile: Namines.API/Dockerfile
    ports:
      - "5000:8080"
    # Tüm sırlar kök .env dosyasından gelir ('__' convention — tek kaynak).
    env_file:
      - .env
    environment:
      # Bu compose dosyası YEREL GELİŞTİRME yığını: portlar localhost'a açık,
      # DB parolası depoda ("..._dev_only_change_in_prod"), migration açılışta
      # koşuyor. "Production" adı buna rağmen duruyordu ve iki gerçek arızaya
      # yol açtı: (1) Desk'in origin'i CORS'a hiç eklenmiyordu, (2) Desk'in
      # ÇEKİRDEK akışı — bir projeye canlı veritabanı bağlamak — imkânsızdı,
      # çünkü `DbHostAccessPolicy` özel/konteyner adreslerine yalnızca
      # Development'ta izin veriyor. Gerçek dağıtımda bu değer Production olur
      # ve aşağıdaki iki `Security__*` satırı yerine gerçek sırlar verilir.
      - ASPNETCORE_ENVIRONMENT=Development
      # Container içinde tüm arayüzlere bind et (localhost olsaydı dışarıdan erişilemezdi).
      - ASPNETCORE_URLS=http://+:8080
      # Desk'in bağlantı dizelerini AES-256-GCM ile şifrelemesi için zorunlu.
      # Tanımsızsa servis bağlantı saklamayı AÇIKÇA REDDEDER (düz metin saklamaz).
      # YALNIZCA yerel geliştirme değeri — gerçek dağıtımda `openssl rand -base64 32`.
      - Security__ConnectionEncryptionKey=dev-only-desk-connection-key-change-me-32ch
      # Konteyner ağındaki (özel adresli) demo veritabanlarına bağlanabilmek için.
      # Yalnızca Development'ta etkili — Production'da kod bunu yok sayar ve loglar.
      - Security__AllowPrivateDbHosts=true
      - Jwt__Issuer=NaminesServer
      - Jwt__Audience=NaminesClient
      # CORS: Production'da localhost otomatik eklenmez, açıkça bildirilmeli.
      # Gerçek deploy'da bunu kendi frontend domain'inle değiştir.
      - App__FrontendUrl=http://localhost:3000
      # Namines Desk (services/desk) — AYRI mikroservis, ayrı port, ayrı origin.
      # App__FrontendUrl TEK değer aldığı için Desk'i buraya yazamıyoruz;
      # Cors:AllowedOrigins dizi olduğu için ikinci origin burada ekleniyor.
      - Cors__AllowedOrigins__0=http://localhost:3200
      # Frontend ile API farklı site'lardaysa (ör. Vercel + Railway) 'true' yap:
      # SameSite=None + Secure cookie üretir. Aynı host/subdomain'de gerekmez.
      - Auth__CrossSiteCookie=false
      # Production'da SSRF koruması AÇIK (dev .env'deki true değerini ez).
      - Executor__AllowPrivateHosts=false
      # ── Namines Vault ─────────────────────────────────────────────────────
      # Yedek dosyalarının at-rest şifreleme anahtarı. Security__ConnectionEncryptionKey
      # ile AYNI OLMAMALI: aynı anahtar, birinin sızmasını ikisinin sızması yapardı.
      # YALNIZCA yerel geliştirme değeri — gerçek dağıtımda `openssl rand -base64 32`.
      - Vault__BackupEncryptionKey=dev-only-vault-backup-key-change-me-32ch
      # Yedekler KALICI volume'de durmalı. Varsayılan yol konteynerin kendi
      # dosya sisteminde olurdu ve konteyner yeniden yaratıldığında bütün
      # yedekler giderdi — yani yedekleme tam da lazım olduğu anda yok olurdu.
      - Vault__StoragePath=/app/data/vault-backups
      # Nesne depo (S3 uyumlu). Vault__S3__Bucket TANIMLIYSA yedekler diske
      # DEGIL buraya yazilir; sunucu diskinin uc sorunu (dolma, instance'lar
      # arasi paylasilamama, sunucu yeniden kurulunca kaybolma) boylece
      # ortadan kalkar. Ayni ayarlar hem AWS S3 hem MinIO icin gecerli.
      # Bu yerel yigitta bilincli olarak BOS: tek instance ve tek makine.
      # - Vault__S3__Bucket=namines-backups
      # - Vault__S3__AccessKey=...
      # - Vault__S3__SecretKey=...
      # - Vault__S3__ServiceUrl=http://minio:9000
      #
      # ⚠️ Bu compose'da yedekleme ÇALIŞMAZ: pg_dump/pg_restore geçici bir
      # konteynerde koşuyor ve backend'in Docker daemon'una erişimi yok
      # (aşağıdaki volumes bloğunda docker.sock bilinçli olarak verilmiyor).
      # Seçenekler ve gerekçeleri: namines-vault/02-ERISIM-VE-DEPLOY.md §2.
      # `GET /api/vault/health` bu durumu açıkça söyler.
      # G7: control DB artık PostgreSQL. Container ağında servis adıyla erişilir.
      - ConnectionStrings__DefaultConnection=Host=namines-control-db;Port=5432;Database=namines_control;Username=namines;Password=namines_dev_only_change_in_prod
    depends_on:
      namines-control-db:
        condition: service_healthy
    volumes:
      # GÜVENLİK: /var/run/docker.sock BİLİNÇLİ OLARAK MOUNT EDİLMEZ.
      # Host'un docker socket'ini container'a vermek, container içindeki koda
      # host üzerinde root eşdeğeri yetki verir (istediği imajı ayrıcalıklı
      # çalıştırabilir, host dosya sistemini mount edebilir). Kullanıcı
      # tetiklemeli sandbox provisioning'i olan çok kiracılı bir serviste bu
      # kabul edilemez.
      #
      # Sandbox özelliği bunun yerine ayrı bir provisioning broker'ı üzerinden
      # çalışır (Kubernetes Job API + gVisor izolasyonu).
      # Bkz. new-phase/06-DATA-PLANE.md
      - namines-app-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Frontend: Next.js 16 ────────────────────────────────────────────────
  namines-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build sırasında API URL'i embed et (public env).
        # NOT: api.ts sonuna "/api" ekliyor; buraya /api YAZMA yoksa ".../api/api" olur.
        NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      namines-backend:
        condition: service_started

# Kalıcı veri volume'ları
volumes:
  namines-control-db-data:   # PostgreSQL control DB (G7)
  namines-app-data:          # Uygulama verisi (loglar, geçici dosyalar vb.)
