services:
  # ─── Backend: ASP.NET Core 8 API ─────────────────────────────────────────
  namines-backend:
    build:
      context: ./backend
      dockerfile: Namines.API/Dockerfile
    ports:
      - "5000:8080"
    # Tüm sırlar kök .env dosyasından gelir ('__' convention — tek kaynak).
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Issuer=NaminesServer
      - Jwt__Audience=NaminesClient
      # Production'da SSRF koruması AÇIK (dev .env'deki true değerini ez).
      - Executor__AllowPrivateHosts=false
    volumes:
      # Docker-in-Docker: sandbox özelliği için host socket (opsiyonel)
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite veritabanını kalıcı tut
      - namines-db:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Frontend: Next.js 16 ────────────────────────────────────────────────
  namines-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build sırasında API URL'i embed et (public env).
        # NOT: api.ts sonuna "/api" ekliyor; buraya /api YAZMA yoksa ".../api/api" olur.
        NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      namines-backend:
        condition: service_started

# Kalıcı veri volume'u (SQLite DB)
volumes:
  namines-db:
