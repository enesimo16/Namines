# Namines Desk — TEK BASINA ayaga kalkar.
#
# Kabul kriteri (third-phase/00-BASLA-BURADAN.md §5): ana backend'in compose'u
# kapaliyken de `docker compose up` calismali. Desk'in kendi veritabani yok;
# yalnizca ana Namines API'sine HTTP ile baglanir, adresi disaridan verilir.
services:
  namines-desk:
    build: .
    ports:
      - "3200:3200"
    environment:
      # Ana Namines API. Ayni makinede calisiyorsa host.docker.internal.
      - NAMINES_API=${NAMINES_API:-http://host.docker.internal:5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
